<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Chat with your documents</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --line:#2a2f3a;
    --text:#e7e9ee; --muted:#9aa3b2; --accent:#7c6cff; --accent-2:#4ade80; --err:#f87171;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --panel-2:#f0f2f5; --line:#e2e5ea;
           --text:#12141a; --muted:#5b6472; }
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--text);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.55rem .9rem;
         background:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}

  /* ---- sidebar ---- */
  aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;gap:.9rem;padding:1rem;overflow-y:auto}
  .brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.5rem}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:1.1rem;text-align:center;
        color:var(--muted);font-size:.9rem;transition:.15s}
  .drop.over{border-color:var(--accent);color:var(--text);background:var(--panel-2)}
  .drop b{color:var(--text)}
  .caps{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .doc{display:flex;justify-content:space-between;gap:.5rem;align-items:center;width:100%;
       text-align:left;background:transparent;color:var(--text);padding:.45rem .6rem;
       border-radius:9px;font-size:.9rem}
  .doc:hover{background:var(--panel-2)}
  .doc.active{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
  .doc small{color:var(--muted);flex:none}
  .grp{margin-bottom:.15rem}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem}
  .pill{font-size:.78rem;padding:.2rem .55rem;border-radius:999px;background:var(--panel-2);
        color:var(--muted);border:1px solid var(--line)}
  .pill.ok{color:var(--accent-2)} .pill.err{color:var(--err)} .pill.run{color:var(--accent)}

  /* ---- chat ---- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .scope{padding:.7rem 1.2rem;border-bottom:1px solid var(--line);color:var(--muted);font-size:.88rem}
  .scope b{color:var(--text)}
  #thread{flex:1;overflow-y:auto;padding:1.5rem 1.2rem;display:flex;flex-direction:column;gap:1.1rem}
  .wrap{max-width:760px;width:100%;margin:0 auto}
  .msg{display:flex;gap:.75rem}
  .av{width:28px;height:28px;flex:none;border-radius:8px;display:grid;place-items:center;
      font-size:.75rem;font-weight:700;background:var(--panel-2);color:var(--muted)}
  .msg.me .av{background:var(--accent);color:#fff}
  .body{min-width:0;white-space:pre-wrap;word-wrap:break-word}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
  .empty h1{color:var(--text);font-size:1.4rem;margin:.2rem 0 .4rem}
  details{margin-top:.6rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);
          padding:.45rem .7rem;font-size:.85rem}
  summary{cursor:pointer;color:var(--muted)}
  details pre{white-space:pre-wrap;color:var(--muted);margin:.5rem 0 0;font-size:.82rem}
  .dots::after{content:'';animation:d 1.2s steps(4,end) infinite}
  @keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  form{border-top:1px solid var(--line);padding:.9rem 1.2rem}
  .box{display:flex;gap:.6rem;align-items:flex-end;background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:.55rem .6rem .55rem .9rem}
  textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);
           font:inherit;max-height:180px}
  .hint{color:var(--muted);font-size:.75rem;text-align:center;margin:.5rem 0 0}
  .err{color:var(--err)}
  @media (max-width:720px){ aside{display:none} }
</style>
</head>
<body>
<aside>
  <div class="brand">📄 Doc Chat</div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,.docx,.md,.txt" hidden/>
    <b>Drop a document</b><br/>or click to browse<br/>
    <span style="font-size:.78rem">PDF · DOCX · MD · TXT</span>
  </label>
  <div id="upStatus" class="pill" hidden></div>

  <div>
    <div class="caps" style="margin-bottom:.4rem">Chat with</div>
    <button class="doc active" data-cat="" id="allBtn">All documents</button>
    <div id="docs"></div>
  </div>

  <div class="foot">
    <button class="ghost" id="ingestBtn">Re-ingest data folder</button>
    <span id="ingestStatus" class="pill">Idle</span>
  </div>
</aside>

<main>
  <div class="scope">Answering from: <b id="scopeName">all documents</b></div>
  <div id="thread">
    <div class="empty" id="empty">
      <h1>Ask your documents anything</h1>
      Upload a file on the left, pick it, and ask away. Answers are grounded in the
      retrieved text and cite their sources.
    </div>
  </div>
  <form id="form">
    <div class="wrap">
      <div class="box">
        <textarea id="q" rows="1" placeholder="Ask a question about your documents…"></textarea>
        <button id="send">Send</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </form>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = t => (t ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let category = '';   // '' = search everything

/* ---------- documents sidebar ---------- */
async function loadDocs(){
  const d = await fetch('/docs').then(r => r.json()).catch(() => ({categories:[]}));
  $('#docs').innerHTML = (d.categories || []).map(c => `
    <div class="grp">
      <div class="caps" style="margin:.6rem 0 .2rem">${esc(c.category)}</div>
      ${c.files.map(f => `<button class="doc" data-cat="${esc(c.category)}">
          <span>${esc(f)}</span></button>`).join('')}
    </div>`).join('');
}

function selectScope(btn){
  document.querySelectorAll('.doc').forEach(b => b.classList.toggle('active', b === btn));
  category = btn.dataset.cat;
  $('#scopeName').textContent = category ? `${category} documents` : 'all documents';
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.doc');
  if (btn) selectScope(btn);
});

/* ---------- upload ---------- */
const drop = $('#drop'), upStatus = $('#upStatus');
const slug = name => (name.replace(/\.[^.]+$/,'')
  .replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'uploads');

async function upload(f){
  if (!f) return;
  upStatus.hidden = false; upStatus.className = 'pill run';
  upStatus.textContent = `Ingesting ${f.name}…`;
  const fd = new FormData();
  fd.append('file', f);
  fd.append('category', slug(f.name));   // own category => chat can scope to this doc
  try {
    const r = await fetch('/upload', {method:'POST', body: fd});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'upload failed');
    upStatus.className = 'pill ok';
    upStatus.textContent = `${d.file} · ${d.chunks ?? '?'} chunks`;
    await loadDocs();
    const btn = [...document.querySelectorAll('.doc')]
      .find(b => b.dataset.cat === d.category);
    if (btn) selectScope(btn);
  } catch (e) {
    upStatus.className = 'pill err';
    upStatus.textContent = e.message;
  }
}
$('#file').addEventListener('change', e => upload(e.target.files[0]));
['dragover','dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
  e.preventDefault();
  drop.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop') upload(e.dataTransfer.files[0]);
}));

/* ---------- chat ---------- */
const thread = $('#thread');
function bubble(who, html){
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'wrap';
  el.innerHTML = `<div class="msg ${who === 'me' ? 'me' : ''}">
      <div class="av">${who === 'me' ? 'You' : 'AI'}</div>
      <div class="body">${html}</div></div>`;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el.querySelector('.body');
}

function sourcesHtml(sources, contexts){
  if (!sources?.length) return '';
  const names = sources.map(s => esc(s.split('/').pop()));
  return `<details><summary>${names.length} source${names.length>1?'s':''}: ${names.join(', ')}</summary>
    ${(contexts || []).map(c => `<pre>${esc(c)}</pre>`).join('')}</details>`;
}

const q = $('#q'), send = $('#send');
q.addEventListener('input', () => { q.style.height='auto'; q.style.height=q.scrollHeight+'px'; });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#form').requestSubmit(); }
});

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim();
  if (!text) return;
  bubble('me', esc(text));
  q.value = ''; q.style.height = 'auto';
  send.disabled = true;
  const out = bubble('ai', '<span class="dots">Thinking</span>');
  try {
    const r = await fetch('/ask', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: text, category})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    out.innerHTML = esc(d.answer) + sourcesHtml(d.sources, d.contexts);
  } catch (err) {
    out.innerHTML = `<span class="err">${esc(err.message || 'request failed')}</span>`;
  } finally {
    send.disabled = false; q.focus();
    thread.scrollTop = thread.scrollHeight;
  }
});

/* ---------- full re-ingest ---------- */
const iBtn = $('#ingestBtn'), iSt = $('#ingestStatus');
async function refreshIngest(){
  try {
    const d = await (await fetch('/ingest/status')).json();
    const s = d.status || 'idle';
    iSt.className = 'pill ' + ({running:'run', succeeded:'ok', failed:'err'}[s] || '');
    iSt.textContent = s[0].toUpperCase() + s.slice(1) +
      (s === 'failed' ? ` — ${d.error || 'error'}` : d.stats ? ` — ${d.stats.chunks} chunks` : '');
    return s;
  } catch { iSt.className='pill err'; iSt.textContent='Status error'; return 'failed'; }
}
iBtn.addEventListener('click', async () => {
  iBtn.disabled = true;
  await fetch('/ingest', {method:'POST'});
  const poll = setInterval(async () => {
    if (await refreshIngest() !== 'running'){ clearInterval(poll); iBtn.disabled = false; loadDocs(); }
  }, 2000);
  refreshIngest();
});

loadDocs(); refreshIngest();
</script>
</body>
</html>
